services:
  neo4j:
    image: neo4j:5
    container_name: img_neo4j
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt
    environment:
      - NEO4J_AUTH=neo4j/24633455
      - NEO4J_PLUGINS=["apoc","graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,gds.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import

  postgres:
    image: postgres:16
    container_name: img_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=img
      - POSTGRES_USER=img
      - POSTGRES_PASSWORD=24633455
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  pg_data:
